# easy-mqtt broker configuration.
# All persistent state lives under /data (the single bind-mounted folder).

# Security is configured globally (per_listener_settings left at its default of
# false), so the dynamic-security plugin and anonymous policy apply to every
# listener — including any TLS/websocket listeners added under /data/config.
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /data/dynamic-security.json

listener 1883

persistence true
persistence_location /data/
persistence_file mosquitto.db

log_dest file /data/log/mosquitto.log
log_dest stdout
log_timestamp true

# User overrides (extra listeners for TLS/websockets, etc.) go here. In global
# security mode they inherit the dynsec plugin automatically — just declare the
# listener. See /data/config/tls.conf.example. Files load in alphabetical order.
include_dir /data/config
