name: Publish Docker Image

on:
  push:
    branches:
      - main
      - 'release-*'
  pull_request:
    branches:
      - main
      - 'release-*'

jobs:
  # Deliberately a separate job rather than a step in `test`: `build` gates on
  # `test`, so a formatting slip in a shared job would skip the image publish
  # and leave :latest silently stale over something purely cosmetic.
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Corepack must be enabled before setup-node so its pnpm cache resolver can
      # find the version pinned in package.json's packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fix locally with `pnpm format`.
      - name: Check formatting
        run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Integration tests are gated behind DYNSEC_IT (need a live broker), so
      # this runs the unit suite only — no broker required in CI.
      - name: Run tests
        run: pnpm test:run

  build:
    runs-on: ubuntu-latest
    needs: test
    # Escape hatch for landing work without cutting a new image: put
    # [skip image] in the merge commit message. Spelled to match GitHub's own
    # markers, but it is ours — GitHub's suppress the entire workflow, tests
    # included, whereas this suppresses only the publish. `head_commit` is
    # null on pull_request events, so PR builds are unaffected.
    if: ${{ !contains(github.event.head_commit.message, '[skip image]') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest is the released image and must only ever come from main.
      # Release trains publish :next instead, so the train can be dogfooded
      # without shipping unreleased code to everyone running :latest.
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "value=latest" >> "$GITHUB_OUTPUT"
          else
            echo "value=next" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/lukanrocks/easy-mqtt:${{ steps.tag.outputs.value }}
