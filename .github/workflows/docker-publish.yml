name: Publish Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Deliberately a separate job rather than a step in `test`: `build` gates on
  # `test`, so a formatting slip in a shared job would skip the image publish
  # and leave :latest silently stale over something purely cosmetic.
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Corepack must be enabled before setup-node so its pnpm cache resolver can
      # find the version pinned in package.json's packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fix locally with `pnpm prettier:format`.
      - name: Check formatting
        run: pnpm prettier:check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Integration tests are gated behind DYNSEC_IT (need a live broker), so
      # this runs the unit suite only — no broker required in CI.
      - name: Run tests
        run: pnpm test

  # Escape hatch for landing work without cutting a new image: put
  # [skip image] in the PR title, which becomes the squash commit's subject.
  # Spelled to match GitHub's own markers, but it is ours — GitHub's suppress
  # the entire workflow, tests included, whereas this suppresses only the
  # publish. Only the subject line counts: the body is the PR description,
  # which may mention the marker without meaning it. `head_commit` is null on
  # pull_request events, so PR builds are unaffected.
  image-gate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      publish: ${{ steps.check.outputs.publish }}

    steps:
      - name: Check commit subject for [skip image]
        id: check
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${MESSAGE%%$'\n'*}"
          if [[ "$subject" == *"[skip image]"* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: [test, image-gate]
    if: ${{ needs.image-gate.outputs.publish == 'true' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/lukanrocks/easy-mqtt:latest
