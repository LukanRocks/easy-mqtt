# Generated by the papelada-repo-governance skill (scripts/dependabot-config.mjs) — regenerate instead of
# editing by hand whenever a workspace package or one of its dependencies is added or removed.
# options: --day friday --time 09:00 --timezone America/Sao_Paulo
version: 2
updates:
  - package-ecosystem: 'npm'
    # Root only: the pnpm workspace has a single lockfile. Per-directory entries update package.json but not
    # pnpm-lock.yaml, which breaks `pnpm install --frozen-lockfile`. Grouping by package gives one PR per scope.
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    # Matches pnpm-workspace.yaml minimumReleaseAge (2880 min); pnpm refuses anything newer.
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      apps-server:
        # apps/server
        patterns:
          - '@hono/node-server'
          - '@hono/zod-validator'
          - 'iron-webcrypto'
          - 'tsup'
          - 'tsx'
      apps-web:
        # apps/web
        patterns:
          - '@radix-ui/react-dialog'
          - '@radix-ui/react-dropdown-menu'
          - '@radix-ui/react-label'
          - '@radix-ui/react-select'
          - '@radix-ui/react-separator'
          - '@radix-ui/react-slot'
          - '@radix-ui/react-switch'
          - '@radix-ui/react-tabs'
          - '@radix-ui/react-tooltip'
          - '@tailwindcss/vite'
          - '@tanstack/react-form'
          - '@tanstack/react-query'
          - '@tanstack/react-router'
          - '@tanstack/react-table'
          - '@types/react'
          - '@types/react-dom'
          - '@vitejs/plugin-react'
          - 'class-variance-authority'
          - 'clsx'
          - 'lucide-react'
          - 'react'
          - 'react-dom'
          - 'sonner'
          - 'tailwind-merge'
          - 'tailwindcss'
          - 'vite'
      workspace-root:
        # root package.json
        patterns:
          - '@commitlint/cli'
          - '@commitlint/config-conventional'
          - 'husky'
          - 'lint-staged'
          - 'prettier'
          - 'prettier-plugin-tailwindcss'
      shared:
        # used by more than one package — one PR bumps it everywhere at once
        patterns:
          - '@types/node' # apps/server, apps/web, packages/dynsec
          - 'hono' # apps/server, apps/web
          - 'mqtt' # apps/server, packages/dynsec
          - 'typescript' # apps/web, root
          - 'vitest' # apps/server, packages/dynsec
          - 'zod' # apps/server, packages/dynsec
      unscoped:
        # Dependencies added since this file was generated — regenerate to scope them.
        patterns:
          - '*'
        exclude-patterns:
          - '@hono/node-server'
          - '@hono/zod-validator'
          - 'iron-webcrypto'
          - 'tsup'
          - 'tsx'
          - '@radix-ui/react-dialog'
          - '@radix-ui/react-dropdown-menu'
          - '@radix-ui/react-label'
          - '@radix-ui/react-select'
          - '@radix-ui/react-separator'
          - '@radix-ui/react-slot'
          - '@radix-ui/react-switch'
          - '@radix-ui/react-tabs'
          - '@radix-ui/react-tooltip'
          - '@tailwindcss/vite'
          - '@tanstack/react-form'
          - '@tanstack/react-query'
          - '@tanstack/react-router'
          - '@tanstack/react-table'
          - '@types/react'
          - '@types/react-dom'
          - '@vitejs/plugin-react'
          - 'class-variance-authority'
          - 'clsx'
          - 'lucide-react'
          - 'react'
          - 'react-dom'
          - 'sonner'
          - 'tailwind-merge'
          - 'tailwindcss'
          - 'vite'
          - '@commitlint/cli'
          - '@commitlint/config-conventional'
          - 'husky'
          - 'lint-staged'
          - 'prettier'
          - 'prettier-plugin-tailwindcss'
          - '@types/node'
          - 'hono'
          - 'mqtt'
          - 'typescript'
          - 'vitest'
          - 'zod'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 2
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions:
        patterns:
          - '*'
